name: Release Linux amd64

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build Linux amd64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/ace-probe-linux-amd64 ./cmd/probe
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

          notes="Linux amd64 build from commit ${GITHUB_SHA}."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/ace-probe-linux-amd64 --clobber
            gh release edit latest --title "Latest" --notes "$notes" --target "$GITHUB_SHA" --latest
          else
            gh release create latest dist/ace-probe-linux-amd64 --verify-tag --title "Latest" --notes "$notes" --latest
          fi
