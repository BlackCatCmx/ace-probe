<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Ace Probe · 服务器资源</title>
    <link rel="stylesheet" href="./vendor/uPlot.min.css" />
    <link rel="stylesheet" href="./app.css" />
    <script defer src="./vendor/uPlot.iife.min.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="page-header">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true"><span></span><span></span><span></span></div>
          <div>
            <div class="eyebrow">ACE PROBE</div>
            <h1>服务器资源 <span id="container-count" class="count">0</span></h1>
          </div>
        </div>
        <div class="header-right">
          <div class="update-status" id="update-status" role="status">
            <span class="status-light"></span>
            <span id="update-text">正在读取数据</span>
          </div>
          <div class="resource-tools">
            <label class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><input id="container-search" type="search" placeholder="搜索容器" autocomplete="off" /></label>
            <div class="scroll-controls" aria-label="浏览容器卡片">
              <button type="button" id="scroll-prev" aria-label="向左浏览">‹</button>
              <button type="button" id="scroll-next" aria-label="向右浏览">›</button>
            </div>
          </div>
        </div>
      </header>

      <div id="error-message" class="error-message" role="alert" hidden></div>

      <main class="dashboard">
        <section class="resources" aria-label="容器卡片">
          <div id="resource-grid" class="resource-grid">
            <div id="container-list" class="container-list" aria-label="容器列表"><p class="list-empty">正在读取容器…</p></div>
          </div>
        </section>

        <section class="detail" aria-label="服务器资源曲线">
          <div class="detail-heading">
            <div class="summary-name">
              <div class="eyebrow" id="selected-kind">当前范围</div>
              <div class="summary-title-row"><h2 id="selected-name">请选择容器</h2><span id="selected-state" class="state-badge">—</span><button type="button" id="show-host" class="host-reset" hidden>返回宿主机</button></div>
              <div id="selected-id" class="container-id">—</div>
            </div>
            <div class="range-group" aria-label="时间范围">
              <button type="button" data-hours="2">2 小时</button>
              <button type="button" data-hours="6" class="active">6 小时</button>
              <button type="button" data-hours="12">12 小时</button>
              <button type="button" data-hours="24">24 小时</button>
            </div>
          </div>

          <div class="chart-grid">
            <article class="chart-card">
              <div class="chart-heading">
                <div>
                  <div class="chart-kicker cpu-color">CPU</div>
                  <h3>处理器占用</h3>
                </div>
                <div class="chart-values"><strong id="current-cpu">—</strong><div id="cpu-readout" class="chart-readout">—</div></div>
              </div>
              <div id="cpu-chart" class="chart"></div>
              <div id="cpu-empty" class="chart-empty">当前时间范围暂无数据</div>
            </article>

            <article class="chart-card">
              <div class="chart-heading">
                <div>
                  <div class="chart-kicker memory-color">MEMORY</div>
                  <h3>内存占用</h3>
                </div>
                <div class="chart-values"><strong id="current-memory">—</strong><div id="memory-readout" class="chart-readout">—</div></div>
              </div>
              <div id="memory-chart" class="chart"></div>
              <div id="memory-empty" class="chart-empty">当前时间范围暂无数据</div>
            </article>
          </div>
        </section>
      </main>
      <footer>数据每分钟采集一次 · 时间均为 UTC+8</footer>
    </div>
  </body>
</html>
